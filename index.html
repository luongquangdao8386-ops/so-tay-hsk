<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3372B">
<meta name="description" content="Học tiếng Trung theo Giáo trình chuẩn HSK: từ vựng, nét chữ, ngữ pháp, luyện tập và ôn tập ngắt quãng.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}</style>
<title>Sổ Tay HSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --sunk:#E9EDE7; --ink:#18201C; --muted:#56625C; --faint:#87918C; --line:#D9DFD8;
  --grid:#E2A89E; --accent:#B3372B; --accent-2:#8E2A20; --on-accent:#FFFFFF; --accent-soft:#F7E3DF;
  --good:#1B7A55; --good-soft:#DCEFE5; --bad:#A95306; --bad-soft:#FBEAD4;
  --t1:#C2410C; --t2:#15803D; --t3:#1D4ED8; --t4:#7E22CE; --t5:#6B7570;
  --shadow:0 1px 2px rgba(24,32,28,.05),0 6px 18px rgba(24,32,28,.06);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-py:"Noto Sans","Be Vietnam Pro","Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101412; --card:#191E1B; --sunk:#222824; --ink:#E5EAE6; --muted:#A1ACA6; --faint:#78837D; --line:#2D3430;
    --grid:#6E3B34; --accent:#E2685B; --accent-2:#F08C80; --on-accent:#1B0C0A; --accent-soft:#3A221F;
    --good:#4CC28E; --good-soft:#17332A; --bad:#F0A24A; --bad-soft:#382914;
    --t1:#FB8C5E; --t2:#4ADE80; --t3:#82A8FF; --t4:#C990FA; --t5:#8F9A94;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101412; --card:#191E1B; --sunk:#222824; --ink:#E5EAE6; --muted:#A1ACA6; --faint:#78837D; --line:#2D3430;
  --grid:#6E3B34; --accent:#E2685B; --accent-2:#F08C80; --on-accent:#1B0C0A; --accent-soft:#3A221F;
  --good:#4CC28E; --good-soft:#17332A; --bad:#F0A24A; --bad-soft:#382914;
  --t1:#FB8C5E; --t2:#4ADE80; --t3:#82A8FF; --t4:#C990FA; --t5:#8F9A94;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.han{font-family:var(--f-han);font-weight:500}
.py{font-family:var(--f-py)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.plain .t1,.plain .t2,.plain .t3,.plain .t4,.plain .t5{color:inherit}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 104px}
.top{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
.seal{width:36px;height:36px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:21px;line-height:1;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.brand b,.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* tian zi ge */
.tzg{position:relative;flex:none;background:var(--card)}
.tzg > svg,.tzg > .tzg-w{position:absolute;inset:0}
.tzg-static{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-han);line-height:1}

.today{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today .tzg{cursor:pointer}
.today-info{min-width:0;display:flex;flex-direction:column;gap:3px}
.today-word{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.today-word .han{font-size:26px}
.today-word .py{font-size:17px;font-weight:500}
.hv{font-size:12.5px;color:var(--muted)}
.hv b{font-weight:600;color:var(--ink)}
.today-mean{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;min-height:48px;font-size:15px}
.btn:disabled{opacity:.45}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.quick button:hover{border-color:var(--faint)}
.quick .k{font-size:12px;color:var(--muted);font-weight:500}
.quick .v{font-size:15px;font-weight:700;line-height:1.3}
.quick .v .han{font-weight:500}
.quick .hot{border-color:var(--accent);background:var(--accent-soft)}
.quick .hot .k{color:var(--accent)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 2px 10px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.lessons{display:flex;flex-direction:column;gap:8px}
.lesson{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.lesson:not(:disabled):hover{border-color:var(--faint)}
.lesson .num{width:48px;height:48px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lesson .num small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.lesson .num b{font-family:var(--f-han);font-size:20px;font-weight:700;margin-top:2px}
.lesson .ttl{min-width:0}
.lesson .ttl .han{display:block;font-size:18px;line-height:1.3}
.lesson .ttl .vi{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:1px}
.lesson .ttl .topic{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.lesson .meta{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.done .num{background:var(--good-soft)}
.lesson.done .num b{color:var(--good)}
.lesson:disabled{opacity:.55}
.lesson:disabled .num{background:transparent;border:1px dashed var(--line)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.ring{width:34px;height:34px}
.ring circle{fill:none;stroke-width:3.2}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--accent);stroke-linecap:round}
.ring.full .fg{stroke:var(--good)}
.later{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.later div{padding:11px 12px;border-radius:12px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.later b{display:block;color:var(--ink);font-size:14px}

/* lesson view */
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;color:var(--muted);padding:6px 8px 6px 2px;margin-left:-2px}
.back:hover{color:var(--ink)}
.lhead{padding:8px 2px 16px}
.lhead .han{font-size:30px;line-height:1.25;display:block;margin-top:6px}
.lhead .py{font-size:15px;color:var(--muted);display:block;margin-top:2px}
.lhead .vi{font-size:16px;font-weight:600;display:block;margin-top:6px}
.lprog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lprog .bar{flex:1}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:11px;margin:18px 0 12px}
.seg button{min-height:36px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.words{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .open{flex:1;min-width:0;display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:12px;align-items:center;text-align:left;padding:11px 4px 11px 14px}
.wrow .open:hover{background:var(--sunk)}
.wrow .h{font-family:var(--f-han);font-size:24px;line-height:1.2;white-space:nowrap}
.wrow .t{min-width:0}
.wrow .t .py{display:block;font-size:14.5px;font-weight:500}
.wrow .t .m{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.st{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--faint)}
.st.learning{background:var(--bad);border-color:var(--bad)}
.st.known{background:var(--good);border-color:var(--good)}
.wrow .icon-btn{margin-right:6px}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 4px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

.gcards{display:flex;flex-direction:column;gap:10px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.gcard h3{font-size:16px;font-weight:700}
.formula{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);font-weight:600;font-size:14px;font-family:var(--f-py)}
.formula .han{font-weight:700}
.gcard p{margin:10px 0 6px;font-size:14px;max-width:62ch}
.ex{display:flex;gap:6px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex .txt{flex:1;min-width:0}
.ex .zh{font-family:var(--f-han);font-size:18px;line-height:1.4}
.ex .p{display:block;font-family:var(--f-py);font-size:13.5px;color:var(--muted)}
.ex .v{display:block;font-size:13.5px}
.ex .icon-btn{width:36px;height:36px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--faint);position:relative}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;line-height:18px;font-variant-numeric:tabular-nums}

/* review & progress */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.big{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.due{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:14px 0 8px}
.stack i{display:block;height:100%}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ladder span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--sunk);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:12px}
.pl{display:grid;grid-template-columns:56px 1fr 48px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.pl span:last-child{text-align:right;color:var(--muted)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:2px}
.set label{flex:1;min-width:0}
.set label b{display:block;font-weight:600;font-size:14px}
.set label span{font-size:12.5px;color:var(--muted)}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.note{font-size:13px;color:var(--muted);line-height:1.55;max-width:62ch}
.note a{color:var(--accent-2)}
.confirm{margin-top:10px;padding:12px;border-radius:10px;background:var(--bad-soft)}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ov-word{z-index:45}
.ov-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:6px 32px;min-height:100%;display:flex;flex-direction:column}
.ov-bar{display:flex;align-items:center;gap:8px;min-height:52px}
.ov-bar .ttl{flex:1;min-width:0;font-weight:600;font-size:14px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ov-bar .sp{width:40px}
.qbar{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}

.wd-top{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
.chips{display:flex;gap:6px}
.chips button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-han);font-size:22px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.wd-info{margin-top:18px;display:flex;flex-direction:column;gap:4px}
.wd-word{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wd-word .han{font-size:40px;line-height:1.15}
.wd-word .py{font-size:22px;font-weight:500}
.wd-mean{font-size:17px;font-weight:500;margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag.lv{background:var(--accent-soft);color:var(--accent-2)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;min-height:19px}
.wd-ex{margin-top:16px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:22px}

.fc{flex:1;display:flex;flex-direction:column}
.fc-card{width:100%;flex:1;min-height:320px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px;gap:6px}
.fc-card .han.hero{font-size:76px;line-height:1.1}
.fc-card .py{font-size:22px;font-weight:500}
.fc-card .mean{font-size:18px;font-weight:600;margin-top:6px}
.fc-card .ex{border:0;margin-top:14px;padding:12px 12px;background:var(--sunk);border-radius:12px;text-align:left;width:100%}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--card)}
.tap{font-size:12.5px;color:var(--faint);margin-top:10px}

.q-prompt{text-align:center;padding:18px 8px 22px}
.q-prompt .kind{font-size:12.5px;color:var(--muted);font-weight:600}
.q-prompt .han{font-size:64px;line-height:1.15;display:block;margin-top:8px}
.q-prompt .mean{font-size:22px;font-weight:600;display:block;margin-top:10px}
.q-prompt .listen{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;margin-top:14px}
.q-prompt .listen .ic{width:36px;height:36px}
.opts{display:grid;gap:8px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{min-height:54px;padding:10px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:left;font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px}
.opt.han-opt{justify-content:center;font-family:var(--f-han);font-size:28px;min-height:72px}
.opt.py-opt{font-family:var(--f-py);font-size:19px;justify-content:center}
.opt:not(:disabled):hover{border-color:var(--faint)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{color:var(--ink);font-weight:500}
.fb .ans .han{font-size:18px}
.result{text-align:center;padding:28px 8px 10px}
.result .big{font-size:64px}
.result p{margin:8px 0 0;color:var(--muted)}
.miss{margin-top:18px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* Bài 0 · phát âm */
.pill.pbtn{cursor:pointer;gap:5px}
.pill.pbtn .ic{width:15px;height:15px}
.pill.pbtn:hover{border-color:var(--faint)}
.lesson.zero .num{background:var(--accent-soft)}
.lesson.zero .num b{color:var(--accent-2)}
.lesson.zero.done .num{background:var(--good-soft)}
.lesson.zero.done .num b{color:var(--good)}
.lesson .ttl .han .py{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.lesson .meta .ic{width:18px;height:18px;color:var(--good)}
.intro{font-size:14.5px;line-height:1.6;margin:0 2px 4px;max-width:62ch}
.drills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drill{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.drill:hover{border-color:var(--faint)}
.drill .k{font-size:14px;font-weight:700;line-height:1.3}
.drill .d{font-size:12px;color:var(--muted);line-height:1.4}
.drill .best{margin-top:4px;font-size:11.5px;font-weight:600;color:var(--accent-2);font-variant-numeric:tabular-nums}
.drill .best.none{color:var(--faint)}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.sbtn:not(:disabled):hover{border-color:var(--faint)}
.sbtn .py{font-size:16px;font-weight:600}
.sbtn .han{font-size:16px;color:var(--muted)}
.sbtn .ic{width:16px;height:16px;color:var(--faint)}
.sbtn:disabled{opacity:.45}
.prows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.plet{min-height:44px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-py);font-weight:600;font-size:19px;line-height:1.1;padding:4px 2px;text-align:center}
.plet small{font-size:10.5px;font-weight:500;color:var(--muted);margin-top:3px;line-height:1.2}
.plet.hot{background:var(--accent-soft);color:var(--accent-2)}
.pdesc{font-size:13.5px;line-height:1.45;min-width:0}
.pair{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;padding:5px 0}
.pair > span{font-family:var(--f-py);font-weight:600;font-size:14px;color:var(--muted)}
.pair .sbtn{width:100%}
.contour{display:block;width:100%;max-width:380px;height:auto;margin:0 auto}
.contour text{fill:currentColor;font-family:var(--f-py)}
.contour .cg{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.contour .cl{fill:var(--faint);font-size:11px}
.contour .cp{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.contour .cx{font-size:17px;font-weight:600;text-anchor:middle}
.contour .cn{fill:var(--muted);font-size:11.5px;text-anchor:middle}
.tcards{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tcard{display:grid;grid-template-columns:62px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tbig{font-family:var(--f-py);font-size:34px;font-weight:600;line-height:1;text-align:center;padding-top:4px}
.tcard h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tcard h3 .han{font-weight:500;color:var(--muted);font-size:15px}
.tcard p{margin:6px 0 0;font-size:13.5px;line-height:1.5}
.tcard .vn{color:var(--muted)}
.tcard .row{margin-top:10px}
.tips{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.tips li{margin-top:4px}
.ph{font-size:15px;font-weight:700}
.tset + .tset{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tset-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.tset-h b{font-size:18px}
.tset-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tchip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-width:0}
.tchip:hover{border-color:var(--faint)}
.tchip .py{font-size:18px;font-weight:600}
.tchip .han{font-size:16px}
.tchip small{font-size:11px;color:var(--muted);line-height:1.25;text-align:center}
.combo{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.combo .hd{font-size:11px;font-weight:600;color:var(--muted);display:grid;place-items:center;text-align:center;min-height:22px}
.combo button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 0;border-radius:8px;background:var(--sunk);min-width:0}
.combo button:hover{outline:1px solid var(--faint)}
.combo .han{font-size:16px;line-height:1.2}
.combo .py{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.three{display:grid;gap:10px}
.three .panel b{font-family:var(--f-py);font-size:18px}
.three .note{margin:4px 0 10px}
.cta1{margin-top:14px}

/* bảng ghép vần */
#ov-chart{z-index:44;overflow:hidden;display:flex;flex-direction:column}
.ch-in{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding-bottom:0}
.ch-search{display:flex;gap:8px;margin-bottom:10px}
.ch-search input{flex:1;min-width:0;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-family:var(--f-py);font-size:16px}
.ch-search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ch-wrap{flex:1;min-height:120px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pyt{border-collapse:separate;border-spacing:0;font-family:var(--f-py)}
.pyt th{position:sticky;background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--muted);z-index:1}
.pyt thead th{top:0;height:32px;min-width:58px;border-bottom:1px solid var(--line)}
.pyt tbody th{left:0;min-width:48px;text-align:left;padding:0 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.pyt thead th.corner{left:0;z-index:3;min-width:48px;border-right:1px solid var(--line)}
.pyt td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.pyt tr.gs th,.pyt tr.gs td{border-top:2px solid var(--faint)}
.pyt td button{width:58px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:500}
.pyt td button:hover{background:var(--sunk)}
.pyt td button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-2);box-shadow:inset 0 0 0 2px var(--accent)}
.pyt td.x{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 7px)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%}
.dots i.on{background:currentColor}
.dots i.grey{box-shadow:inset 0 0 0 1.2px var(--faint)}
.dots i.no{background:transparent}
.sheet{flex:none;margin:0 -16px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(24,32,28,.07)}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top > div{flex:1;min-width:0}
.sh-syl{font-size:26px;font-weight:600;line-height:1.1}
.sh-comp{font-size:12.5px;color:var(--muted);font-family:var(--f-py)}
.sh-note{margin:8px 0 0}
.tones4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tb{min-height:66px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.tb:not(:disabled):hover{border-color:var(--faint)}
.tb .py{font-size:19px;font-weight:600}
.tb .han{font-size:17px}
.tb small{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.2}
.tb:disabled{border-style:dashed;opacity:.7}
.tb:disabled .py{color:var(--faint)}
.ch-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.ch-legend > span{display:inline-flex;align-items:center;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* luyện nghe */
.opt.stack{flex-direction:column;gap:0}
.opt.stack small{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);font-weight:500}
.opt.right small,.opt.wrong small{color:inherit}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px}

@media (max-width:380px){
  .today{gap:12px;padding:12px}
  .pair{grid-template-columns:58px 1fr 1fr;gap:6px}
  .combo{padding:6px;gap:3px}
  .wrow .open{grid-template-columns:minmax(52px,auto) 1fr;gap:10px}
  .wrow .h{font-size:21px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<script>
const DATA={"level":1,"name":"HSK 1","note":"Thứ tự bài theo Giáo trình chuẩn HSK 1. Câu ví dụ, giải thích ngữ pháp và bài luyện đều tự soạn, không chép bài khoá hay audio của sách. Từ có \"x\": true là từ bổ trợ, không nằm trong danh sách từ mới của bài.","lessons":[{"n":1,"zh":"你好","py":"Nǐ hǎo","vi":"Xin chào","topic":"Chào hỏi · Xin lỗi","words":[{"h":"你","p":"ni3","vi":"bạn, anh, chị (người đang nói chuyện với mình)","hv":"nhĩ","t":"đại từ","ex":["你好！","Nǐ hǎo!","Chào bạn!"],"o":1,"n":1},{"h":"好","p":"hao3","vi":"tốt, khỏe, hay","hv":"hảo","t":"tính từ","ex":["老师好！","Lǎoshī hǎo!","Em chào thầy/cô ạ!"],"o":1,"n":1},{"h":"您","p":"nin2","vi":"ông, bà, ngài (cách gọi kính trọng của 你)","hv":"nâm","t":"đại từ","ex":["您好！","Nín hǎo!","Cháu chào ông/bà ạ!"],"o":2,"n":1},{"h":"你们","p":"ni3 men5","vi":"các bạn, các anh chị","hv":"nhĩ môn","t":"đại từ","ex":["你们好！","Nǐmen hǎo!","Chào các bạn!"],"o":null,"n":1},{"h":"对不起","p":"dui4 bu5 qi3","vi":"xin lỗi","hv":"đối bất khởi","t":"động từ","ex":["对不起，老师！","Duìbuqǐ, lǎoshī!","Em xin lỗi thầy/cô!"],"o":1,"n":1},{"h":"没关系","p":"mei2/guan1 xi5","vi":"không sao, không có gì","hv":"một quan hệ","t":"cụm từ","ex":["没关系，没关系。","Méi guānxi, méi guānxi.","Không sao đâu, không sao đâu."],"o":1,"n":1}],"grammar":[{"t":"Bốn thanh điệu","f":"ā · á · ǎ · à · a","d":"Tiếng Trung phổ thông có 4 thanh và 1 thanh nhẹ. Cùng một âm nhưng khác thanh là khác nghĩa. Thanh 1 cao và đều. Thanh 2 đi lên, gần dấu sắc. Thanh 3 xuống thấp rồi hơi lên, gần dấu hỏi. Thanh 4 rơi mạnh từ cao xuống, như dấu huyền đọc dứt khoát. Thanh nhẹ đọc ngắn, nhẹ và không ghi dấu.","ex":[["妈","mā","mẹ"],["麻","má","cây gai"],["马","mǎ","con ngựa"],["骂","mà","mắng"]]},{"t":"Chào hỏi với 好","f":"Người được chào + 好","d":"Muốn chào ai, đặt từ chỉ người đó trước 好. Dùng 您 với người lớn tuổi, thầy cô hoặc khi cần lịch sự.","ex":[["你好！","Nǐ hǎo!","Chào bạn!"],["您好！","Nín hǎo!","Chào ông/bà ạ!"],["你们好！","Nǐmen hǎo!","Chào các bạn!"]]},{"t":"Hai thanh 3 đứng liền nhau","f":"3 + 3 → đọc 2 + 3","d":"Khi hai âm tiết thanh 3 đứng cạnh nhau, âm tiết đầu đọc thành thanh 2. Pinyin vẫn viết dấu thanh 3 như cũ.","ex":[["你好","nǐ hǎo → đọc ní hǎo","xin chào"]]}]},{"n":2,"zh":"谢谢你","py":"Xièxie nǐ","vi":"Cảm ơn bạn","topic":"Cảm ơn · Tạm biệt","words":[{"h":"谢谢","p":"xie4 xie5","vi":"cảm ơn","hv":"tạ tạ","t":"động từ","ex":["谢谢你！","Xièxie nǐ!","Cảm ơn bạn!"],"o":1,"n":1},{"h":"不","p":"bu4","vi":"không (phủ định)","hv":"bất","t":"phó từ","ex":["不好。","Bù hǎo.","Không tốt."],"o":1,"n":1},{"h":"不客气","p":"bu2/ke4 qi5","vi":"đừng khách sáo, không có gì","hv":"bất khách khí","t":"cụm từ","ex":["谢谢！——不客气！","Xièxie! — Bú kèqi!","Cảm ơn! — Không có gì!"],"o":1,"n":1},{"h":"再见","p":"zai4 jian4","vi":"tạm biệt, hẹn gặp lại","hv":"tái kiến","t":"động từ","ex":["老师，再见！","Lǎoshī, zàijiàn!","Em chào thầy/cô, em về ạ!"],"o":1,"n":1}],"grammar":[{"t":"不 đổi thanh","f":"不 bù + thanh 4 → bú","d":"不 vốn đọc thanh 4. Khi đứng trước một âm tiết thanh 4, nó đổi thành thanh 2. Sách thường ghi luôn thanh đã đổi. Trước thanh 1, 2, 3 thì giữ nguyên bù.","ex":[["不客气","bú kèqi","không có gì"],["不是","bú shì","không phải"],["不好","bù hǎo","không tốt (giữ nguyên bù)"]]},{"t":"Cảm ơn, xin lỗi và cách đáp","f":"谢谢 → 不客气 · 对不起 → 没关系","d":"Đáp lời cảm ơn bằng 不客气, hoặc ngắn gọn là 不谢. Đáp lời xin lỗi bằng 没关系. Khi chia tay, hai bên cùng nói 再见.","ex":[["谢谢你！——不客气！","Xièxie nǐ! — Bú kèqi!","Cảm ơn bạn! — Không có gì!"],["对不起！——没关系！","Duìbuqǐ! — Méi guānxi!","Xin lỗi! — Không sao!"],["再见！","Zàijiàn!","Tạm biệt!"]]}]},{"n":3,"zh":"你叫什么名字","py":"Nǐ jiào shénme míngzi","vi":"Bạn tên là gì?","topic":"Hỏi tên · Quốc tịch","words":[{"h":"叫","p":"jiao4","vi":"gọi; tên là","hv":"khiếu","t":"động từ","ex":["我叫李明。","Wǒ jiào Lǐ Míng.","Tôi tên là Lý Minh."],"o":1,"n":1},{"h":"什么","p":"shen2 me5","vi":"gì, cái gì","hv":"thập ma","t":"đại từ nghi vấn","ex":["你叫什么名字？","Nǐ jiào shénme míngzi?","Bạn tên là gì?"],"o":1,"n":1},{"h":"名字","p":"ming2 zi5","vi":"tên","hv":"danh tự","t":"danh từ","ex":["老师叫什么名字？", "Bạn là giáo viên à?"],["不是，我是学生。","Bú shì, wǒ shì xuésheng.","Không phải, tôi là học sinh."]]},{"t":"Câu hỏi với 什么","f":"… 什么 (+ danh từ)？","d":"Đặt 什么 đúng vào chỗ của thông tin muốn hỏi, không đảo lên đầu câu. Câu đã có 什么 thì không thêm 吗.","ex":[["你叫什么名字？","Nǐ jiào shénme míngzi?","Bạn tên là gì?"],["我叫李明。","Wǒ jiào Lǐ Míng.","Tôi tên là Lý Minh."]]}]},{"n":4,"zh":"她是我的汉语老师","py":"Tā shì wǒ de Hànyǔ lǎoshī","vi":"Cô ấy là cô giáo tiếng Trung của tôi","topic":"Giới thiệu người khác","words":[{"h":"她","p":"ta1","vi":"cô ấy, chị ấy, bà ấy","hv":"tha","t":"đại từ","ex":["她是我的老师。","Tā shì wǒ de lǎoshī.","Cô ấy là cô giáo của tôi."],"o":1,"n":1},{"h":"谁","p":"shei2","vi":"ai","hv":"thùy","t":"đại từ nghi vấn","ex":["你的汉语老师是谁？","Nǐ de Hànyǔ lǎoshī shì shéi?","Giáo viên tiếng Trung của bạn là ai?"],"o":1,"n":1},{"h":"的","p":"de5","vi":"của (trợ từ sở hữu)","hv":"đích","t":"trợ từ","ex":["我的汉语老师是中国人。","Wǒ de Hànyǔ lǎoshī shì Zhōngguó rén.","Giáo viên tiếng Trung của tôi là người Trung Quốc."],"o":1,"n":1},{"h":"汉语","p":"Han4 yu3","vi":"tiếng Hán, tiếng Trung","hv":"Hán ngữ","t":"danh từ","ex":["她是汉语老师。","Tā shì Hànyǔ lǎoshī.","Cô ấy là giáo viên tiếng Trung."],"o":1,"n":1},{"h":"哪","p":"na3","vi":"nào","hv":"na","t":"đại từ nghi vấn","ex":["你是哪国人？","Nǐ shì nǎ guó rén?","Bạn là người nước nào?"],"o":1,"n":1},{"h":"国","p":"guo2","vi":"nước, quốc gia","hv":"quốc","t":"danh từ","ex":["他是哪国人？","Tā shì nǎ guó rén?","Anh ấy là người nước nào?"],"o":null,"n":1},{"h":"呢","p":"ne5","vi":"(trợ từ) còn … thì sao?","hv":"ni","t":"trợ từ","ex":["我是越南人，你呢？","Wǒ shì Yuènán rén, nǐ ne?","Tôi là người Việt Nam, còn bạn?"],"o":1,"n":1},{"h":"他","p":"ta1","vi":"anh ấy, ông ấy","hv":"tha","t":"đại từ","ex":["他是谁？","Tā shì shéi?","Anh ấy là ai?"],"o":1,"n":1},{"h":"同学","p":"tong2 xue2","vi":"bạn học, bạn cùng lớp","hv":"đồng học","t":"danh từ","ex":["她是我的同学。","Tā shì wǒ de tóngxué.","Cô ấy là bạn học của tôi."],"o":1,"n":1},{"h":"朋友","p":"peng2 you5","vi":"bạn, bạn bè","hv":"bằng hữu","t":"danh từ","ex":["他是我的中国朋友。","Tā shì wǒ de Zhōngguó péngyou.","Anh ấy là bạn người Trung Quốc của tôi."],"o":1,"n":1}],"grammar":[{"t":"Trợ từ 的 chỉ sở hữu","f":"Người sở hữu + 的 + người/vật","d":"Tiếng Trung đặt người sở hữu lên trước, ngược với tiếng Việt: 我的老师 là \"thầy của tôi\". Với người thân hoặc quan hệ gần gũi có thể bỏ 的, ví dụ 我朋友, 我家.","ex":[["我的老师","wǒ de lǎoshī","thầy/cô của tôi"],["他的名字","tā de míngzi","tên của anh ấy"],["我朋友","wǒ péngyou","bạn tôi"]]},{"t":"Hỏi với 谁 và 哪","f":"… 是谁？ · … 是哪国人？","d":"Giống 什么, từ để hỏi đứng đúng chỗ thông tin cần hỏi. 哪 phải có danh từ hoặc lượng từ đi sau: 哪国 là \"nước nào\".","ex":[["他是谁？——他是我的同学。","Tā shì shéi? — Tā shì wǒ de tóngxué.","Anh ấy là ai? — Anh ấy là bạn học của tôi."],["你是哪国人？——我是越南人。","Nǐ shì nǎ guó rén? — Wǒ shì Yuènán rén.","Bạn là người nước nào? — Tôi là người Việt Nam."]]},{"t":"Hỏi lại với 呢","f":"Danh từ / đại từ + 呢？","d":"Sau khi nói về mình, dùng 呢 để hỏi lại người kia cùng nội dung đó, giống \"còn bạn?\" trong tiếng Việt.","ex":[["我叫李明，你呢？","Wǒ jiào Lǐ Míng, nǐ ne?","Tôi tên là Lý Minh, còn bạn?"],["我是学生，你呢？","Wǒ shì xuésheng, nǐ ne?","Tôi là học sinh, còn bạn?"]]}]},{"n":5,"zh":"她女儿今年二十岁","py":"Tā nǚ'ér jīnnián èrshí suì","vi":"Con gái cô ấy năm nay hai mươi tuổi","topic":"Gia đình · Tuổi tác","words":[{"h":"家","p":"jia1","vi":"nhà, gia đình","hv":"gia","t":"danh từ","ex":["你家有几口人？","Nǐ jiā yǒu jǐ kǒu rén?","Nhà bạn có mấy người?"],"o":1,"n":1},{"h":"有","p":"you3","vi":"có","hv":"hữu","t":"động từ","ex":["我家有四口人。","Wǒ jiā yǒu sì kǒu rén.","Nhà tôi có bốn người."],"o":1,"n":1},{"h":"口","p":"kou3","vi":"(lượng từ đếm người trong nhà); miệng","hv":"khẩu","t":"lượng từ","ex":["她家有三口人。","Tā jiā yǒu sān kǒu rén.","Nhà chị ấy có ba người."],"o":3,"n":1},{"h":"女儿","p":"nv3 er2","vi":"con gái","hv":"nữ nhi","t":"danh từ","ex":["她女儿今年五岁。","Tā nǚ'ér jīnnián wǔ suì.","Con gái chị ấy năm nay 5 tuổi."],"o":1,"n":1},{"h":"几","p":"ji3","vi":"mấy (hỏi số lượng nhỏ)","hv":"kỷ","t":"đại từ nghi vấn","ex":["你女 hí suì","mười tuổi"],"o":1,"n":1}],"grammar":[{"t":"Hỏi số lượng với 几","f":"几 + lượng từ + danh từ","d":"几 dùng khi người hỏi đoán con số nhỏ, thường dưới 10. Sau 几 phải có lượng từ, ví dụ 口 khi đếm người trong nhà.","ex":[["你家有几口人？","Nǐ jiā yǒu jǐ kǒu rén?","Nhà bạn có mấy người?"],["我家有三口人。","Wǒ jiā yǒu sān kǒu rén.","Nhà tôi có ba người."]]},{"t":"Hỏi tuổi","f":"几岁 (trẻ nhỏ) · 多大 (người trẻ, bạn bè)","d":"Hỏi trẻ em dùng 几岁. Hỏi người trẻ hoặc bạn bè dùng 多大. Với người lớn tuổi cần cách hỏi lịch sự hơn, sẽ học ở bài sau.","ex":[["你几岁了？","Nǐ jǐ suì le?","Cháu mấy tuổi rồi?"],["你今年多大？——我今年二十岁。","Nǐ jīnnián duō dà? — Wǒ jīnnián èrshí suì.","Năm nay bạn bao nhiêu tuổi? — Năm nay tôi 20 tuổi."]]},{"t":"Số đếm 1–99","f":"hàng chục + 十 + hàng đơn vị","d":"Ghép số gần giống tiếng Việt, nhưng không đổi âm như \"mốt\", \"lăm\": 二十一 là 21, 二十五 là 25.","ex":[["十一","shíyī","11"],["二十","èrshí","20"],["二十五","èrshíwǔ","25"],["九十九","jiǔshíjiǔ","99"]]},{"t":"了 cuối câu: đã … rồi","f":"Câu + 了","d":"了 ở cuối câu báo hiệu một tình huống mới hoặc một sự thay đổi, gần với \"rồi\" trong tiếng Việt.","ex":[["她二十岁了。","Tā èrshí suì le.","Cô ấy 20 tuổi rồi."],["我女儿六岁了。","Wǒ nǚ'ér liù suì le.","Con gái tôi 6 tuổi rồi."]]},{"t":"Câu có 有","f":"A + 有 + B · phủ định: 没有","d":"有 nghĩa là \"có\". Phủ định của 有 là 没有, không nói 不有.","ex":[["我家有五口人。","Wǒ jiā yǒu wǔ kǒu rén.","Nhà tôi có năm người."],["我没有中国朋友。","Wǒ méiyǒu Zhōngguó péngyou.","Tôi không có bạn người Trung Quốc."]]}]},{"n":6,"zh":"我会说汉语","py":"Wǒ huì shuō Hànyǔ","vi":"Tôi biết nói tiếng Trung","soon":true},{"n":7,"zh":"今天几号","py":"Jīntiān jǐ hào","vi":"Hôm nay ngày mấy?","soon":true},{"n":8,"zh":"我想喝茶","py":"Wǒ xiǎng hē chá","vi":"Tôi muốn uống trà","soon":true},{"n":9,"zh":"你儿子在哪儿工作","py":"Nǐ érzi zài nǎr gōngzuò","vi":"Con trai bạn làm việc ở đâu?","soon":true},{"n":10,"zh":"我能坐这儿吗","py":"Wǒ néng zuò zhèr ma","vi":"Tôi ngồi đây được không?","soon":true},{"n":11,"zh":"现在几点","py":"Xiànzài jǐ diǎn","vi":"Bây giờ là mấy giờ?","soon":true},{"n":12,"zh":"明天天气怎么样","py":"Míngtiān tiānqì zěnmeyàng","vi":"Thời tiết ngày mai thế nào?","soon":true},{"n":13,"zh":"他在学做中国菜呢","py":"Tā zài xué zuò Zhōngguó cài ne","vi":"Anh ấy đang học nấu món Trung Quốc","soon":true},{"n":14,"zh":"她买了不少衣服","py":"Tā mǎi le bù shǎo yīfu","vi":"Cô ấy đã mua khá nhiều quần áo","soon":true},{"n":15,"zh":"我是坐飞机来的","py":"Wǒ shì zuò fēijī lái de","vi":"Tôi đến bằng máy bay","soon":true}],"pron":{"n":0,"zh":"发音","py":"fāyīn","vi":"Phát âm","topic":"Nhập môn · Pinyin","intro":"Pinyin là cách ghi âm tiếng Trung bằng chữ Latinh. Mỗi âm tiết gồm ba phần: thanh mẫu (phụ âm đầu), vận mẫu (phần vần) và thanh điệu. Ví dụ mā = m + a + thanh 1. Nhiều chữ cái đọc khác tiếng Việt, nên hãy nghe kỹ từng âm.","secs":[{"id":"tones","zh":"声调","py":"shēngdiào","vi":"Thanh điệu","sub":"4 thanh và thanh nhẹ, so với dấu tiếng Việt"},{"id":"initials","zh":"声母","py":"shēngmǔ","vi":"Thanh mẫu","sub":"21 phụ âm đầu, cặp bật hơi và không bật hơi"},{"id":"finals","zh":"韵母","py":"yùnmǔ","vi":"Vận mẫu","sub":"36 vần, chú ý ü, -n/-ng và er"},{"id":"rules","zh":"规则","py":"guīzé","vi":"Quy tắc","sub":"Biến điệu 3+3, 不, 一 · cách viết y, w, ü"},{"id":"chart","zh":"拼音表","py":"pīnyīn biǎo","vi":"Bảng ghép vần","sub":"Khoảng 400 âm tiết × 4 thanh, chạm để nghe"}],"tones":{"intro":"Tiếng Trung phổ thông có 4 thanh và 1 thanh nhẹ. Cùng một âm tiết, đổi thanh là đổi nghĩa. Người Việt có lợi thế vì đã quen nghe dấu thanh, nhưng mỗi thanh không trùng hẳn với dấu nào: hãy chú ý độ cao lúc bắt đầu.","items":[{"t":1,"name":"Thanh 1","zh":"阴平","c":"55","d":"Cao và bằng, giữ đều từ đầu đến cuối như hát một nốt cao.","vn":"Giống thanh ngang (không dấu) nhưng đặt giọng cao hơn hẳn.","ex":"ma1","m":"mẹ"},{"t":2,"name":"Thanh 2","zh":"阳平","c":"35","d":"Đi lên từ giọng trung bình lên cao, giống khi hỏi lại “Hả?”.","vn":"Gần dấu sắc, nhưng lên từ từ và kéo dài hơn, không gắt.","ex":"ma2","m":"cây gai"},{"t":3,"name":"Thanh 3","zh":"上声","c":"214","d":"Hạ xuống thật thấp rồi hơi lên lại. Khi đứng trước âm tiết khác thường chỉ đọc nửa đầu: xuống thấp là dừng.","vn":"Gần dấu hỏi. Nửa thanh 3 (trong câu) nghe gần dấu nặng nhưng không ngắt hơi.","ex":"ma3","m":"con ngựa"},{"t":4,"name":"Thanh 4","zh":"去声","c":"51","d":"Rơi mạnh từ cao nhất xuống thấp nhất, ngắn và dứt khoát như khi ra lệnh “Đi!”.","vn":"Gần dấu huyền nhưng bắt đầu cao hơn nhiều và ngắn gọn hơn.","ex":"ma4","m":"mắng"},{"t":5,"name":"Thanh nhẹ","zh":"轻声","c":"","d":"Đọc ngắn và nhẹ, không ghi dấu. Độ cao tùy âm tiết đứng trước. Thường gặp ở trợ từ (吗, 呢, 的) và âm tiết thứ hai của từ lặp (妈妈).","vn":"Giống một tiếng đọc lướt, không nhấn.","say":"妈妈","sayPy":"māma","m":"mẹ"}],"mistakes":["Thanh 1 đặt giọng chưa đủ cao, nghe thành thanh ngang tiếng Việt.","Thanh 4 đọc thấp và kéo dài như dấu huyền. Cần bắt đầu ở độ cao của thanh 1 rồi rơi nhanh.","Thanh 3 đọc gắt như dấu hỏi ở mọi chỗ. Trong câu, phần lớn thanh 3 chỉ là nửa thanh 3 (xuống thấp).","Nhầm thanh 2 và thanh 3: thanh 2 đi lên ngay, thanh 3 xuống trước rồi mới lên."],"sets":[{"s":"ma","m":["mẹ","cây gai","con ngựa","mắng"]},{"s":"ba","m":["tám","nhổ","cầm, nắm","bố"]},{"s":"shi","m":["thầy","thời gian","khiến","là"]},{"s":"tang","m":["canh","nhà Đường","nằm","chuyến"]}],"combos":[[["今天","jīntiān","hôm nay"],["中国","Zhōngguó","Trung Quốc"],["铅笔","qiānbǐ","bút chì"],["医院","yīyuàn","bệnh viện"],["桌子","zhuōzi","cái bàn"]],[["明天","míngtiān","ngày mai"],["同学","tóngxué","bạn học"],["没有","méiyǒu","không có"],["学校","xuéxiào","trường học"],["朋友","péngyou","bạn bè"]],[["老师","lǎoshī","giáo viên"],["女儿","nǚ'ér","con gái"],["你好","nǐ hǎo","xin chào (đọc ní hǎo)"],["米饭","mǐfàn","cơm"],["椅子","yǐzi","cái ghế"]],[["面包","miànbāo","bánh mì"],["大学","dàxué","đại học"],["汉语","Hànyǔ","tiếng Trung"],["再见","zàijiàn","tạm biệt"],["谢谢","xièxie","cảm ơn"]]]},"initials":{"intro":"Thanh mẫu là phụ âm đứng đầu âm tiết. Có 21 thanh mẫu, chia theo chỗ phát âm. Điều quan trọng nhất với người Việt: nhiều cặp chỉ khác nhau ở chỗ có bật hơi hay không.","groups":[{"name":"Hai môi và môi răng","items":[{"l":"b","ex":"ba1","vi":"Gần “b” nhưng không rung, không bật hơi (giữa b và p)."},{"l":"p","ex":"pa4","vi":"Như “p” và bật mạnh luồng hơi ra."},{"l":"m","ex":"ma1","vi":"Như “m”."},{"l":"f","ex":"fa1","vi":"Như “ph”."}]},{"name":"Đầu lưỡi giữa","items":[{"l":"d","ex":"da4","vi":"Như “t” tiếng Việt (không phải “đ”)."},{"l":"t","ex":"ta1","vi":"Như “th” tiếng Việt, có bật hơi."},{"l":"n","ex":"na2","vi":"Như “n”."},{"l":"l","ex":"la1","vi":"Như “l”."}]},{"name":"Cuống lưỡi","items":[{"l":"g","ex":"ge1","vi":"Như “c/k”, không bật hơi."},{"l":"k","ex":"ke1","vi":"Như “c/k” nhưng bật mạnh hơi (không đọc là “kh”)."},{"l":"h","ex":"he1","vi":"Gần “kh” tiếng Việt: hơi cọ ở cuống lưỡi."}]},{"name":"Mặt lưỡi","items":[{"l":"j","ex":"ji1","vi":"Gần “ch” tiếng Việt, mặt lưỡi áp vào vòm, môi dẹt."},{"l":"q","ex":"qi1","vi":"Như j nhưng bật hơi (không đọc là “qu”)."},{"l":"x","ex":"xi1","vi":"Gần “x” nhưng nâng mặt lưỡi, môi dẹt như đang cười."}]},{"name":"Uốn lưỡi","items":[{"l":"zh","ex":"zhi1","vi":"Gần “tr” uốn lưỡi, không bật hơi."},{"l":"ch","ex":"chi1","vi":"Như zh nhưng bật hơi (khác “ch” tiếng Việt)."},{"l":"sh","ex":"shi1","vi":"Gần “s” uốn lưỡi (kiểu đọc “s” chuẩn)."},{"l":"r","ex":"ri4","vi":"Uốn lưỡi như sh nhưng rung giọng, gần “r” đọc nhẹ."}]},{"name":"Đầu lưỡi trước","items":[{"l":"z","ex":"zi4","vi":"Gần “ts”: đầu lưỡi chạm sau răng cửa trên, không bật hơi."},{"l":"c","ex":"ci2","vi":"Như z nhưng bật hơi mạnh (không đọc là “c/k”)."},{"l":"s","ex":"si4","vi":"Như “x” tiếng Việt."}]}],"asp":{"d":"Sáu cặp dưới đây chỉ khác nhau ở luồng hơi. Mẹo: để tờ giấy trước miệng. Đọc âm bật hơi (p, t, k, q, ch, c) thì giấy phải rung, đọc âm không bật hơi thì giấy gần như đứng yên.","pairs":[["b","p","ba4","pa4"],["d","t","du2","tu2"],["g","k","ge1","ke1"],["j","q","ji1","qi1"],["zh","ch","zhi1","chi1"],["z","c","zi4","ci4"]]},"three":{"d":"Ba nhóm này hay bị đọc lẫn vào nhau. Khác biệt nằm ở vị trí lưỡi.","cols":[{"g":"zh ch sh","d":"Uốn lưỡi: đầu lưỡi cong lên chạm phần cứng của vòm miệng.","ex":["zhi4","chi4","shi4"]},{"g":"z c s","d":"Lưỡi thẳng: đầu lưỡi chạm sau răng cửa trên.","ex":["zi4","ci4","si4"]},{"g":"j q x","d":"Mặt lưỡi áp vào vòm, đầu lưỡi hạ sau răng cửa dưới. Chỉ đi với i và ü.","ex":["ji4","qi4","xi4"]}],"spi":"Ở đây i không đọc là “i”. Giữ nguyên lưỡi ở vị trí phụ âm và kéo dài âm ra: zhī, chī, shī, rì nghe gần “trư, tr'ư, sư, rư”; zī, cī, sī nghe gần “tzư, ts'ư, xư”."}},"finals":{"intro":"Vận mẫu là phần vần đứng sau thanh mẫu. Có 36 vận mẫu: 6 vần đơn, 4 vần kép, 5 vần mũi, và các vần bắt đầu bằng i, u, ü, cộng thêm er. Khi không có thanh mẫu đứng trước, vần bắt đầu bằng i, u, ü được viết lại với y và w (xem Quy tắc).","groups":[{"name":"Vần đơn","items":[{"f":"a","vi":"Như “a”.","ex":"a1"},{"f":"o","vi":"Tròn môi, gần “ô” hơi lướt từ “u”: bō nghe gần “pua”.","ex":"bo1"},{"f":"e","vi":"Gần “ưa” đọc liền một hơi, lưỡi lùi về sau.","ex":"e4"},{"f":"i","w":"yi","vi":"Như “i”.","ex":"yi1"},{"f":"u","w":"wu","vi":"Như “u”.","ex":"wu3"},{"f":"ü","w":"yu","vi":"Đặt lưỡi như đọc “i” rồi chúm tròn môi, gần “uy” nhưng tròn môi ngay từ đầu.","ex":"yu3","hot":true}]},{"name":"Vần kép","items":[{"f":"ai","vi":"Như “ai”.","ex":"ai4"},{"f":"ei","vi":"Gần “ây”.","ex":"mei3"},{"f":"ao","vi":"Như “ao”.","ex":"hao3"},{"f":"ou","vi":"Gần “âu”.","ex":"zou3"}]},{"name":"Vần mũi","items":[{"f":"an","vi":"Như “an”.","ex":"an1"},{"f":"en","vi":"Gần “ân”.","ex":"men2"},{"f":"ang","vi":"Như “ang”.","ex":"mang2"},{"f":"eng","vi":"Gần “âng”.","ex":"leng3","hot":true},{"f":"ong","vi":"Gần “ung”, môi tròn.","ex":"dong1","hot":true}]},{"name":"Bắt đầu bằng i","items":[{"f":"ia","w":"ya","vi":"i + a đọc lướt.","ex":"jia1"},{"f":"ie","w":"ye","vi":"Gần “iê”.","ex":"xie4"},{"f":"iao","w":"yao","vi":"i + ao đọc lướt.","ex":"jiao4"},{"f":"iou","w":"you · -iu","vi":"Gần “iêu”: liù nghe gần “liêu”.","ex":"liu4"},{"f":"ian","w":"yan","vi":"Gần “iên”, không đọc “i-an”.","ex":"tian1","hot":true},{"f":"in","w":"yin","vi":"Như “in”.","ex":"xin1"},{"f":"iang","w":"yang","vi":"i + ang.","ex":"liang3"},{"f":"ing","w":"ying","vi":"Gần “inh”.","ex":"ting2","hot":true},{"f":"iong","w":"yong","vi":"Gần “i-ung”.","ex":"xiong2"}]},{"name":"Bắt đầu bằng u","items":[{"f":"ua","w":"wa","vi":"Gần “oa”.","ex":"hua1"},{"f":"uo","w":"wo","vi":"Gần “uô”.","ex":"guo2"},{"f":"uai","w":"wai","vi":"Gần “oai”.","ex":"kuai4"},{"f":"uei","w":"wei · -ui","vi":"Gần “uây”: duì nghe gần “tuây”.","ex":"dui4"},{"f":"uan","w":"wan","vi":"Gần “oan”.","ex":"guan1"},{"f":"uen","w":"wen · -un","vi":"Gần “uân”: chūn nghe gần “truân”.","ex":"chun1"},{"f":"uang","w":"wang","vi":"Gần “oang”.","ex":"huang2"},{"f":"ueng","w":"weng","vi":"Gần “uâng”, chỉ có âm tiết weng.","ex":"weng1"}]},{"name":"Bắt đầu bằng ü","items":[{"f":"üe","w":"yue","vi":"ü + ê, tròn môi.","ex":"xue2"},{"f":"üan","w":"yuan","vi":"Gần “uyên”.","ex":"yuan3"},{"f":"ün","w":"yun","vi":"Gần “uyn”, tròn môi.","ex":"yun2"}]},{"name":"Vần đặc biệt","items":[{"f":"er","vi":"Đọc “ơ” rồi cong đầu lưỡi lên. Không ghép với thanh mẫu nào.","ex":"er4"}]}],"u":{"d":"ü là âm người Việt dễ đọc sai nhất. Nghe từng cặp: bên trái là u, bên phải là ü.","pairs":[["nu3","nv3"],["lu4","lv4"]],"note":"Sau j, q, x và y, hai chấm của ü được bỏ đi nhưng vẫn đọc là ü: jú, qù, xū, yú. Chỉ sau n và l mới phải viết ü để phân biệt: nǔ (努) khác nǚ (女)."},"nasal":{"d":"Vần -n kết thúc bằng đầu lưỡi chạm lợi trên, miệng khép lại. Vần -ng kết thúc ở cuống lưỡi, miệng vẫn mở. Nghe từng cặp:","pairs":[["an","ang","fan4","fang4"],["en","eng","men2","meng2"],["in","ing","xin1","xing1"],["ian","iang","xian1","xiang1"],["uan","uang","guan1","guang1"]]}},"rules":[{"t":"Đặt dấu thanh ở đâu","f":"a › o, e › i, u, ü","d":"Dấu thanh đặt trên nguyên âm chính. Có a thì đặt trên a. Không có a thì đặt trên o hoặc e. Gặp iu hoặc ui thì đặt trên chữ đứng sau. Chấm của i bỏ đi khi có dấu: ī í ǐ ì.","ex":[["好","hǎo","tốt (dấu trên a)"],["谢","xiè","cảm ơn (dấu trên e)"],["六","liù","sáu (iu: dấu trên u)"],["对","duì","đúng (ui: dấu trên i)"]]},{"t":"Hai thanh 3 đứng liền nhau","f":"3 + 3 → đọc 2 + 3","d":"Âm tiết thanh 3 đứng trước một thanh 3 khác thì đọc thành thanh 2. Pinyin vẫn viết dấu thanh 3. Trước thanh 1, 2, 4 và thanh nhẹ, thanh 3 chỉ đọc nửa đầu (xuống thấp rồi dừng).","ex":[["你好","nǐ hǎo → đọc ní hǎo","xin chào"],["很好","hěn hǎo → đọc hén hǎo","rất tốt"],["可以","kěyǐ → đọc kéyǐ","có thể"],["老师","lǎoshī (nửa thanh 3)","giáo viên"]]},{"t":"Biến điệu của 不","f":"不 bù + thanh 4 → bú","d":"不 vốn đọc thanh 4. Đứng trước thanh 4 thì đổi thành thanh 2. Trước thanh 1, 2, 3 giữ nguyên bù. Sách và app này ghi luôn thanh đã đổi.","ex":[["不是","bú shì","không phải"],["不去","bú qù","không đi"],["不好","bù hǎo","không tốt"],["不忙","bù máng","không bận"]]},{"t":"Biến điệu của 一","f":"一 yī → yí (trước thanh 4) · yì (trước thanh 1, 2, 3)","d":"Đọc một mình, khi đếm số, hay đứng cuối từ thì 一 giữ thanh 1. Đứng trước thanh 4 đổi thành yí, trước thanh 1, 2, 3 đổi thành yì.","ex":[["一","yī","một"],["第一","dì yī","thứ nhất"],["一个","yí gè","một cái"],["一天","yì tiān","một ngày"],["一年","yì nián","một năm"],["一起","yìqǐ","cùng nhau"]]},{"t":"Viết y và w","f":"i- → y · u- → w · ü- → yu","d":"Khi không có thanh mẫu, vần bắt đầu bằng i, u, ü được viết lại: i, in, ing thêm y ở trước (yi, yin, ying); các vần i- khác đổi i thành y (ya, ye, you, yan…). u thêm w thành wu; các vần u- khác đổi u thành w (wa, wo, wei, wen…). ü và vần ü- viết thành yu (yu, yue, yuan, yun).","ex":[["衣","yī","áo (i → yi)"],["有","yǒu","có (iou → you)"],["五","wǔ","năm (u → wu)"],["我","wǒ","tôi (uo → wo)"],["鱼","yú","cá (ü → yu)"],["月","yuè","tháng, trăng (üe → yue)"]]},{"t":"Bỏ hai chấm của ü","f":"j q x y + ü → viết u · n l + ü → giữ ü","d":"j, q, x không bao giờ đi với u, nên ü sau chúng được viết gọn thành u nhưng vẫn đọc là ü. Sau n và l phải giữ hai chấm để phân biệt với u. Khi gõ trên bàn phím, dùng chữ v thay cho ü.","ex":[["去","qù","đi (đọc qü)"],["学","xué","học (đọc xüe)"],["女","nǚ","nữ, con gái"],["努力","nǔlì","cố gắn };

/* ---------- dữ liệu ---------- */
const LESSONS=DATA.lessons;
const WORDS=[];
LESSONS.forEach(L=>(L.words||[]).forEach((w,i)=>{w.id=L.n+"-"+w.h;w.lesson=L.n;w.i=i;WORDS.push(w);}));
const WBY=Object.fromEntries(WORDS.map(w=>[w.id,w]));
const lessonWords=n=>WORDS.filter(w=>w.lesson===n);
const READY=LESSONS.filter(L=>!L.soon);

/* ---------- lưu trữ ---------- */
const KEY="sotayhsk.v1";
const DEF_SET={slow:false,hv:true,tones:true};
let S=(function(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}s=s&&typeof s==="object"?s:{};const pr=s.pron&&typeof s.pron==="object"?s.pron:{};return{cards:s.cards||{},days:s.days||[],set:Object.assign({},DEF_SET,s.set||{}),pron:{seen:pr.seen||{},best:pr.best||{}}};})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- ngày ---------- */
function sod(d){d=d?new Date(d):new Date();d.setHours(0,0,0,0);return d.getTime();}
function addDays(t,n){const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime();}
function dkey(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function eod(){return addDays(sod(),1)-1;}
function markActive(){const k=dkey(Date.now());if(!S.days.includes(k)){S.days.push(k);if(S.days.length>500)S.days=S.days.slice(-500);}}
function streak(){const set=new Set(S.days);let t=sod();if(!set.has(dkey(t)))t=addDays(t,-1);let n=0;while(set.has(dkey(t))){n++;t=addDays(t,-1);}return n;}
function fmtDate(t){const d=new Date(t);return d.getDate()+"/"+(d.getMonth()+1);}

/* ---------- ôn tập ngắt quãng ---------- */
const IV=[0,1,2,4,7,15,30];
function status(id){const c=S.cards[id];if(!c)return"new";return c.b>=4?"known":"learning";}
function rate(id,ok){const c=S.cards[id]||{b:0,n:0,l:0};c.n++;if(ok){c.b=Math.min(c.b+1,6);c.due=addDays(sod(),IV[c.b]);}else{c.b=1;c.l++;c.due=sod();}S.cards[id]=c;markActive();save();}
function quizMark(id,ok){const c=S.cards[id];if(!ok)rate(id,false);else if(!c||c.due<=eod())rate(id,true);else{markActive();save();}}
function dueIds(){const e=eod();return WORDS.filter(w=>S.cards[w.id]&&S.cards[w.id].due<=e).map(w=>w.id);}
function learnedIds(){return WORDS.filter(w=>S.cards[w.id]).map(w=>w.id);}

/* ---------- pinyin ---------- */
const MK={a:"āáǎà",e:"ēéěè",i:"īíǐì",o:"ōóǒò",u:"ūúǔù","ü":"ǖǘǚǜ"};
function parsePy(p){return p.split("/").map(wd=>wd.trim().split(/\s+/).map(s=>{const m=s.match(/^([A-Za-züÜvV]+)([1-5])$/);if(!m)return{b:s,t:5};return{b:m[1].replace(/v/g,"ü").replace(/V/g,"Ü"),t:+m[2]};}));}
function markSyl(b,t){if(t===5)return b;const lo=b.toLowerCase();let i=-1;
  if(lo.includes("a"))i=lo.indexOf("a");else if(lo.includes("e"))i=lo.indexOf("e");else if(lo.includes("ou"))i=lo.indexOf("o");
  else for(let k=lo.length-1;k>=0;k--){if("iouü".includes(lo[k])){i=k;break;}}
  if(i<0)return b;let r=MK[lo[i]][t-1];if(b[i]!==lo[i])r=r.toUpperCase();return b.slice(0,i)+r+b.slice(i+1);}
function renderPy(words,html){return words.map(sy=>sy.map((s,k)=>{let txt=markSyl(s.b,s.t);if(k>0&&/^[aeo]/i.test(s.b))txt="'"+txt;return html?'<span class="t'+s.t+'">'+txt+"</span>":txt;}).join("")).join(" ");}
const pyText=p=>renderPy(parsePy(p),false);
const pyHTML=p=>'<span class="py'+(S.set.tones?"":" plain")+'">'+renderPy(parsePy(p),true)+"</span>";
function pyVariants(p,n){const base=parsePy(p);const right=renderPy(base,false);const out=new Set();let guard=0;
  const flat=[];base.forEach((w,wi)=>w.forEach((s,si)=>flat.push([wi,si])));
  while(out.size<n&&guard++<200){const cp=base.map(w=>w.map(s=>({b:s.b,t:s.t})));const[wi,si]=flat[Math.floor(Math.random()*flat.length)];const s=cp[wi][si];let t;do{t=1+Math.floor(Math.random()*4);}while(t===s.t);s.t=t;
    if(flat.length>1&&Math.random()<.35){const[w2,s2]=flat[Math.floor(Math.random()*flat.length)];const o=cp[w2][s2];let t2;do{t2=1+Math.floor(Math.random()*4);}while(t2===o.t);o.t=t2;}
    const r=renderPy(cp,false);if(r!==right)out.add(r);}
  return[...out];}

/* ---------- phát âm ---------- */
let zhVoice=null,voicesLoaded=false;
const hasTTS="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function loadVoices(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();if(vs.length)voicesLoaded=true;zhVoice=vs.find(v=>/^zh[-_]CN/i.test(v.lang))||vs.find(v=>/^cmn/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|yue/i.test(v.lang))||null;}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==="progress")renderProgress();};}
function speakQ(list){stopAudio();if(!hasTTS){toast("Trình duyệt này chưa hỗ trợ đọc tiếng Trung.");return;}
  try{speechSynthesis.cancel();list.forEach(text=>{const u=new SpeechSynthesisUtterance(String(text).replace(/——/g,"，"));u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=S.set.slow?.6:.85;speechSynthesis.speak(u);});
    if(voicesLoaded&&!zhVoice)toast("Máy chưa có giọng đọc tiếng Trung. Xem hướng dẫn ở mục Tiến độ.");}catch(e){}}
function speak(text){speakQ([text]);}

/* Âm tiết mẫu: khoá dạng "ma1" (v thay cho ü). Có file audio/ma1.mp3 (liệt kê trong audio/index.json) thì phát file, không thì giọng máy đọc chữ đại diện. */
const AUD={keys:null,ext:"mp3",buf:{},src:null,ctx:null,token:0};
function hasFile(k){return!!(AUD.keys&&AUD.keys.has(k));}
function stopAudio(){AUD.token++;if(AUD.src){try{AUD.src.onended=null;AUD.src.stop();}catch(e){}AUD.src=null;}}
function audioCtx(){try{if(!AUD.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AUD.ctx=new C();}if(AUD.ctx.state==="suspended")AUD.ctx.resume();return AUD.ctx;}catch(e){return null;}}
function loadBuf(k){if(AUD.buf[k])return Promise.resolve(AUD.buf[k]);const c=AUD.ctx;
  return fetch("audio/"+k+"."+AUD.ext).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer();}).then(a=>new Promise((ok,bad)=>c.decodeAudioData(a,ok,bad))).then(b=>(AUD.buf[k]=b));}
function playKeys(keys){keys=keys.filter(k=>hasFile(k)||kChar(k));if(!keys.length){toast("Âm này chưa có mẫu đọc.");return;}
  if(!keys.every(hasFile)||!audioCtx()){speakQ(keys.map(kChar).filter(Boolean));return;}
  stopAudio();if(hasTTS)try{speechSynthesis.cancel();}catch(e){}
  const token=AUD.token;let i=0;
  const next=()=>{if(token!==AUD.token||i>=keys.length)return;const k=keys[i++];
    loadBuf(k).then(b=>{if(token!==AUD.token)return;const src=AUD.ctx.createBufferSource();src.buffer=b;src.connect(AUD.ctx.destination);src.onended=()=>{if(AUD.src===src)AUD.src=null;setTimeout(next,250);};AUD.src=src;src.start(0);})
      .catch(()=>{if(token!==AUD.token)return;AUD.keys.delete(k);const rest=keys.slice(i-1).map(kChar).filter(Boolean);if(rest.length)speakQ(rest);});};
  next();}
const playKey=k=>playKeys([k]);
function loadAudioIndex(){if(!/^https?:$/.test(location.protocol))return;
  try{fetch("audio/index.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.keys)&&j.keys.length){AUD.keys=new Set(j.keys);if(j.ext)AUD.ext=String(j.ext).replace(/^\./,"");}}).catch(()=>{});}catch(e){}}
const speakBtn=(text,label)=>'<button class="icon-btn" data-say="'+esc(text)+'" aria-label="'+esc(label||"Nghe")+'">'+IC.speak+"</button>";

/* ---------- ô chữ điền (田字格) + nét chữ ---------- */
function tzg(size){return'<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" aria-hidden="true"><rect x="0.75" y="0.75" width="98.5" height="98.5" fill="none" style="stroke:var(--grid)" stroke-width="1.5"/><path d="M50 1V99M1 50H99" fill="none" style="stroke:var(--grid)" stroke-width="0.8" stroke-dasharray="3.2 2.6"/></svg>';}
function colors(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();return{ink:g("--ink"),line:g("--line"),accent:g("--accent"),faint:g("--faint")};}

/* ---------- tiện ích ---------- */
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const hvLine=w=>S.set.hv&&w.hv?'<div class="hv">Hán Việt: <b>'+esc(w.hv)+"</b></div>":"";

  if(w.x)s+='<span class="tag">Từ bổ trợ</span>';return s;}
function ring(done,total){const p=total?done/total:0;const C=2*Math.PI*14;return'<svg class="ring'+(p>=1?" full":"")+'" viewBox="0 0 34 34" aria-hidden="true"><circle class="bg" cx="17" cy="17" r="14"/>'+(p>0?'<circle class="fg" cx="17" cy="17" r="14" stroke-dasharray="'+(p*C).toFixed(1)+" "+C.toFixed(1)+'" transform="rotate(-90 17 17)"/>':"")+'</svg>';}
function lessonStat(n){const ws=lessonWords(n);const learned=ws.filter(w=>status(w.id)!=="new").length;const known=ws.filter(w=>status(w.id)==="known").length;return{total:ws.length,learned,known};}
function nextLesson(){return READY.find(L=>lessonStat(L.n).learned<lessonStat(L.n).total)||READY[READY.length-1];}

function startCards(ids,title){if(!ids.length){toast("Không có thẻ nào để học.");return;}fc={q:ids.slice(),i:0,flip:false,ok:0,seen:0,reps:{},title:title,done:false,firstTry:{}};renderCards();const o=$("#ov-cards");o.hidden=false;o.scrollTop=0;document.body.style.overflow="hidden";}

/* ---------- Luyện tập ---------- */
let qz=null;
function buildQ(w,pool){const types=["meaning","hanzi","pinyin"];if(hasTTS)types.push("listen");const type=types[Math.floor(Math.random()*types.length)];
  const others=pool.filter(x=>x.id!==w.id);let opts;
  if(type==="meaning"){const d=pick(others.filter(x=>x.vi!==w.vi),3).map(x=>({label:x.vi,id:x.id}));opts=shuffle([{label:w.vi,id:w.id,ok:true}].concat(d));}
  else if(type==="pinyin"){const d=pyVariants(w.p,3).map(v=>({label:v}));opts=shuffle([{label:pyText(w.p),ok:true}].concat(d));}
  else{const sameLen=others.filter(x=>x.h.length===w.h.length);const src=sameLen.length>=3?sameLen:others;const d=pick(src,3).map(x=>({label:x.h,id:x.id,han:true}));opts=shuffle([{label:w.h,id:w.id,ok:true,han:true}].concat(d));}
  return{id:w.id,type,opts};}
function startQuiz(ids,title){const pool=WORDS.filter(w=>READY.some(L=>L.n===w.lesson));const words=ids.map(i=>WBY[i]);
  if(words.length<1){toast("Hãy học vài từ trước khi luyện tập.");return;}
  const chosen=shuffle(words).slice(0,10);while(chosen.length<Math.min(10,words.length*2)&&chosen.length<10)chosen.push(words[Math.floor(Math.random()*words.length)]);
  qz={qs:chosen.map(w=>buildQ(w,pool)),i:0,score:0,wrong:[],answered:null,title:title};renderQuiz();const o=$("#ov-quiz");o.hidden=false;o.scrollTop=0;document.body.style.overflow="hidden";}
function renderQuiz(){const o=$("#ov-quiz");let h='<div class="ov-in"><div class="ov-bar"><button class="icon-btn" data-close="ov-quiz" aria-label="Đóng">'+IC.close+'</button><div class="ttl">'+esc(qz.title)+(qz.i<qz.qs.length?" · Câu "+(qz.i+1)+"/"+qz.qs.length:"")+'</div><span class="sp"></span></div>';
  if(qz.i>=qz.qs.length){const n=qz.qs.length;const wrongU=[...new Set(qz.wrong)];
    h+='<div class="result"><div class="eyebrow">Kết quả</div><div class="big">'+qz.score+"/"+n+"</div><p>"+(qz.score===n?"Không sai câu nào.":qz.score>=n*.7?"Khá tốt. Xem lại vài từ bên dưới.":"Nên học thẻ lại các từ sai rồi làm lần nữa.")+"</p></div>";
    if(wrongU.length)h+='<div class="miss"><div class="sub-h">Từ cần xem lại</div><div class="words">'+wrongU.map(id=>{const w=WBY[id];return'<div class="wrow"><button class="open" data-word="'+w.id+'" data-wlist="'+wrongU.join(",")+'"><span class="h">'+esc(w.h)+'</span><span class="t">'+pyHTML(w.p)+'<span class="m">'+esc(w.vi)+"</span></span></button>"+speakBtn(w.h)+"</div>";}).join("")+"</div></div>";
    h+='<div class="pager"><button class="btn" id="qz-again">Làm lại</button>'+(wrongU.length?'<button class="btn primary" id="qz-cards">Học thẻ từ sai</button>':'<button class="btn primary" data-close="ov-quiz">Xong</button>')+"</div></div>";
    o.innerHTML=h;const ids=qz.qs.map(q=>q.id);$("#qz-again").onclick=()=>startQuiz([...new Set(ids)],qz.title);if(wrongU.length)$("#qz-cards").onclick=()=>{$("#ov-quiz").hidden=true;startCards(wrongU,"Từ cần xem lại");};return;}
  const q=qz.qs[qz.i];const w=WBY[q.id];
  h+='<div class="qbar"><i style="width:'+(qz.i/qz.qs.length*100).toFixed(1)+'%"></i></div><div class="q-prompt">';
  if(q.type==="meaning")h+='<div class="kind">Chọn nghĩa đúng</div><span class="han">'+esc(w.h)+"</span>";
  else if(q.type==="hanzi")h+='<div class="kind">Chọn chữ Hán có nghĩa</div><span class="mean">'+esc(w.vi)+"</span>";
  else if(q.type==="pinyin")h+='<div class="kind">Chọn pinyin đúng (chú ý thanh điệu)</div><span class="han">'+esc(w.h)+"</span>";
  else h+='<div class="kind">Nghe và chọn chữ Hán</div><button class="listen" data-say="'+esc(w.h)+'" aria-label="Nghe lại">'+IC.speak+"</button>";
  h+="</div>";
  const han=q.opts[0].han;const cls=q.type==="pinyin"?" py-opt":han?" han-opt":"";
  h+='<div class="opts'+(han||q.type==="pinyin"?" grid2":"")+'">'+q.opts.map((op,i)=>{let c="opt"+cls;if(qz.answered!==null){if(op.ok)c+=" right";else if(i===qz.answered)c+=" wrong";}return'<button class="'+c+'" data-opt="'+i+'" '+(qz.answered!==null?"disabled":"")+">"+esc(op.label)+"</button>";}).join("")+"</div>";
  if(qz.answered!==null){const ok=q.opts[qz.answered].ok;h+='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Chính xác":"Chưa đúng")+'</b><span class="ans"><span class="han">'+esc(w.h)+"</span> "+pyHTML(w.p)+" · "+esc(w.vi)+'</span></div><div style="margin-top:12px"><button class="btn primary block" id="qz-next">'+(qz.i===qz.qs.length-1?"Xem kết quả":"Câu tiếp")+IC.next+"</button></div>";}
  h+="</div>";o.innerHTML=h;
  if(qz.answered===null){o.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-opt");qz.answered=i;const ok=!!q.opts[i].ok;if(ok)qz.score++;else qz.wrong.push(q.id);quizMark(q.id,ok);speak(w.h);renderQuiz();const n=$("#qz-next");if(n)n.focus();});
    if(q.type==="listen")setTimeout(()=>speak(w.h),200);}
  else $("#qz-next").onclick=()=>{qz.i++;qz.answered=null;renderQuiz();o.scrollTop=0;};}

function kParse(k){const m=String(k).match(/^([a-zv]+)([1-5])$/);return m?{s:m[1],t:+m[2]}:null;}
function kChar(k){const p=kParse(k);const a=p&&SYL[p.s];return a&&p.t<5?(a[p.t-1]||""):"";}
function kExists(k){const p=kParse(k);const a=p&&SYL[p.s];return!!(a&&p.t<5&&a[p.t-1]!=null);}
const sBase=s=>s.replace(/v/g,"ü");
function kPy(k){const p=kParse(k);return p?markSyl(sBase(p.s),p.t):k;}
function kPyHTML(k){const p=kParse(k);return'<span class="py'+(S.set.tones?"":" plain")+'"><span class="t'+(p?p.t:5)+'">'+esc(kPy(k))+"</span></span>";}
function sndBtn(k,cls){const ch=kChar(k);const ok=!!ch||hasFile(k);return'<button class="sbtn'+(cls?" "+cls:"")+'" data-key="'+k+'"'+(ok?"":" disabled")+' aria-label="Nghe '+esc(kPy(k))+'">'+kPyHTML(k)+(ch?'<span class="han">'+esc(ch)+"</span>":"")+IC.speak+"</button>";}

function contourSVG(){const W=320,H=176,top=14,bot=124,x0=30;const y=l=>bot-(l-1)*(bot-top)/4;const cols=[[5,5],[3,5],[2,1,4],[5,1]];const cw=(W-x0-4)/4;
  let s='<svg class="contour" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Đường đi của 4 thanh trên thang 5 bậc: thanh 1 là 55, thanh 2 là 35, thanh 3 là 214, thanh 4 là 51">';
  for(let l=1;l<=5;l++)s+='<line class="cg" x1="'+x0+'" x2="'+(W-4)+'" y1="'+y(l)+'" y2="'+y(l)+'"/><text class="cl" x="'+(x0-14)+'" y="'+(y(l)+4)+'">'+l+"</text>";
  cols.forEach((pts,i)=>{const xa=x0+cw*i+14,xb=x0+cw*(i+1)-14,step=(xb-xa)/(pts.length-1);
    const d=pts.map((l,j)=>(j?"L":"M")+(xa+step*j).toFixed(1)+" "+y(l).toFixed(1)).join(" ");
    s+='<path class="cp" d="'+d+'" style="stroke:var(--t'+(i+1)+')"/><circle cx="'+xb.toFixed(1)+'" cy="'+y(pts[pts.length-1]).toFixed(1)+'" r="4.5" style="fill:var(--t'+(i+1)+')"/>';
    s+='<text class="cx t'+(i+1)+'" x="'+((xa+xb)/2).toFixed(1)+'" y="'+(H-26)+'">'+markSyl("ma",i+1)+'</text><text class="cn" x="'+((xa+xb)/2).toFixed(1)+'" y="'+(H-8)+'">'+pts.join("")+"</text>";});
  return s+"</svg>";}

function secTones(){const T=PRON.tones;

  h+='<div class="sec-h"><h2>Nghe liền 4 thanh</h2><span>chạm để nghe</span></div><div class="panel">'+T.sets.map(st=>{const ks=[1,2,3,4].map(t=>st.s+t);

  const hd=["+ 1","+ 2","+ 3","+ 4","+ nhẹ"];
  h+='<div class="sec-h"><h2>Ghép hai thanh</h2><span>chạm để nghe</span></div><div class="combo" role="grid" aria-label="Bảng từ hai âm tiết theo thanh"><span class="hd"></span>'+hd.map(x=>'<span class="hd">'+x+"</span>").join("")+
    T.combos.map((row,i)=>'<span class="hd">'+(i+1)+"</span>"+row.map(w=>'<button data-say="'+esc(w[0])+'" aria-label="'+esc(w[1]+", "+w[2])+'" title="'+esc(w[2])+'"><span class="han">'+esc(w[0])+'</span><span class="py">'+esc(w[1])+"</span></button>").join("")).join("")+"</div>";
  h+='<p class="note" style="margin:8px 4px 0">Hàng là thanh của âm tiết đầu, cột là thanh của âm tiết sau. Chú ý ô 3 + 3: 你好 đọc thành ní hǎo.</p>';
  return h+drillBtn("tone","Luyện nghe chọn thanh");}

function rowsHTML(items,left){return'<div class="prows">'+items.map(it=>'<div class="prow">'+left(it)+'<span class="pdesc">'+esc(it.vi)+"</span>"+sndBtn(it.ex)+"</div>").join("")+"</div>";}

  I.groups.forEach(g=>{h+='<div class="sub-h">'+esc(g.name)+"</div>"+rowsHTML(g.items,it=>'<span class="plet">'+esc(it.l)+"</span>");});

  h+='<div class="panel" style="margin-top:10px"><h3 class="ph">Chữ i sau zh ch sh r z c s</h3><p class="note" style="margin:6px 0 10px">'+esc(I.three.spi)+'</p><div class="row">'+["zhi1","chi1","shi1","ri4","zi1","ci2","si1"].map(k=>sndBtn(k)).join("")+"</div>"+drillBtn("retro","Luyện nghe ba nhóm này")+"</div>";

  h+='<div class="sec-h"><h2>u hay ü</h2></div><div class="panel"><p class="note" style="margin:0 0 8px">'+esc(F.u.d)+"</p>"+F.u.pairs.map(p=>'<div class="pair"><span>u – ü</span>'+sndBtn(p[0])+sndBtn(p[1])+"</div>").join("")+'<p class="note" style="margin:10px 0 0">'+esc(F.u.note)+"</p></div>";
  h+='<div class="sec-h"><h2>-n hay -ng</h2></div><div class="panel"><p class="note" style="margin:0 0 8px">'+esc(F.nasal.d)+"</p>"+F.nasal.pairs.map(p=>'<div class="pair"><span>'+esc(p[0])+" – "+esc(p[1])+"</span>"+sndBtn(p[2])+sndBtn(p[3])+"</div>").join("")+drillBtn("nasal","Luyện nghe -n / -ng")+"</div>";
  return h;}
function secRules(){return'<div class="gcards">'+PRON.rules.map(g=>'<article class="gcard"><h3>'+esc(g.t)+'</h3><span class="formula">'+hanWrap(g.f)+"</span><p>"+esc(g.d)+"</p>"+g.ex.map(exHTML).join("")+"</article>").join("")+'</div><button class="btn block cta1" data-chart="">'+IC.grid+"Mở bảng ghép vần</button>";}

let chartSel=null;
function dotsHTML(s){return'<span class="dots" aria-hidden="true">'+SYL[s].map((c,i)=>'<i class="'+(c?"on t"+(i+1):c===""?"grey":"no")+'"></i>').join("")+"</span>";}
function openChart(focus){if(!PRON)return;pronSeen("chart");chartSel=null;const C=PRON.chart,o=$("#ov-chart");
  let h='<div class="ov-in ch-in"><div class="ov-bar"><button class="icon-btn" data-close="ov-chart" aria-label="Đóng">'+IC.close+'</button><div class="ttl">Bảng ghép vần · '+Object.keys(SYL).length+' âm tiết</div><span class="sp"></span></div>';
  h+='<div class="ch-search"><input id="ch-q" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Tìm âm tiết: zhuang, lü, xue…" aria-label="Tìm âm tiết"></div>';
  h+='<div class="ch-wrap" id="ch-wrap"><table class="pyt'+(S.set.tones?"":" plain")+'"><thead><tr><th scope="col" class="corner"><span class="sr">Vận mẫu, thanh mẫu</span></th>'+C.ini.map(i=>'<th scope="col">'+(i?esc(i):'<span title="Không có thanh mẫu">∅</span>')+"</th>").join("")+"</tr></thead><tbody>";
  C.rows.forEach(r=>{h+="<tr"+(["i","u","ü","-i"].includes(r.f)?' class="gs"':"")+'><th scope="row">'+esc(r.f)+"</th>"+r.s.map(s=>s?'<td><button data-cell="'+s+'" aria-pressed="false" aria-label="'+esc(sBase(s))+'"><span>'+esc(sBase(s))+"</span>"+dotsHTML(s)+"</button></td>":'<td class="x"></td>').join("")+"</tr>";});
  h+='</tbody></table></div><div class="sheet" id="ch-sheet" aria-live="polite">'+sheetHTML(null)+"</div></div>";
  o.innerHTML=h;o.hidden=false;document.body.style.overflow="hidden";
  const q=$("#ch-q");q.addEventListener("input",()=>{const k=findSyl(q.value);if(k)selectCell(k,true,false);else if(q.value.trim().length>=2){chartSel=null;$("#ch-sheet").innerHTML=sheetHTML(null,"Không có âm tiết “"+q.value.trim()+"” trong tiếng phổ thông.");markSel();}});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();q.blur();}});
  if(focus&&SYL[focus])selectCell(focus,true,false);}
function findSyl(q){q=String(q).toLowerCase().trim().replace(/u:/g,"ü").replace(/[ǖǘǚǜ]/g,"ü").normalize("NFD").replace(/[\u0300\u0301\u0304\u030c]/g,"").normalize("NFC").replace(/[\s'0-9]/g,"").replace(/ü/g,"v");
  if(!q)return null;if(SYL[q])return q;const alt=q.replace(/^([jqxy])v/,"$1u");return SYL[alt]?alt:null;}
function spellNote(s){const p=SYLPOS[s];if(!p)return"";const out=[];const i=p.i,f=p.f,w=sBase(s);
  if(f==="-i")out.push("Chữ i ở đây không đọc là “i”: giữ lưỡi ở vị trí của "+i+" và kéo dài âm.");
  else if(!i&&/^[iuü]/.test(f)&&w!==f)out.push("Không có thanh mẫu nên "+f+" viết thành "+w+".");
  else if(/^[jqx]$/.test(i)&&f[0]==="ü")out.push("Sau "+i+", ü viết thành u nhưng vẫn đọc là ü.");
  else if(/^[nl]$/.test(i)&&f[0]==="ü")out.push("Sau "+i+" phải giữ hai chấm để phân biệt với u.");
  else if(i&&["iou","uei","uen"].includes(f))out.push(f+" viết gọn thành "+({iou:"iu",uei:"ui",uen:"un"})[f]+" nhưng vẫn đọc đủ.");
  const tip=[];if(i&&INI_VI[i])tip.push("<b>"+esc(i)+"</b>: "+esc(INI_VI[i]));if(f!=="-i"&&FIN_VI[f])tip.push("<b>"+esc(f)+"</b>: "+esc(FIN_VI[f]));
  return(out.length?esc(out.join(" "))+(tip.length?"<br>":""):"")+tip.join("<br>");}
function sheetHTML(s,msg){if(!s)return'<div class="ch-legend"><span>'+'<span class="dots"><i class="on t1"></i><i class="on t2"></i><i class="on t3"></i><i class="on t4"></i></span> 4 chấm là 4 thanh, có âm đọc mẫu</span><span><span class="dots"><i class="grey"></i></span> có âm nhưng chưa có mẫu</span><span><span class="dots"><i class="no" style="box-shadow:inset 0 0 0 1px var(--line);border-radius:2px"></i></span> không có thanh đó</span></div><p class="note" style="margin:8px 0 0">'+esc(msg||"Hàng là vận mẫu, cột là thanh mẫu (∅: không có thanh mẫu). Ô gạch chéo là tổ hợp không có trong tiếng phổ thông. Chạm một ô để nghe cả 4 thanh.")+"</p>";
  const p=SYLPOS[s],arr=SYL[s],keys=[1,2,3,4].map(t=>s+t),avail=keys.filter(k=>kChar(k)||hasFile(k));
  let h='<div class="sh-top"><div><div class="sh-syl py">'+esc(sBase(s))+'</div><div class="sh-comp">'+(p.i?esc(p.i):"∅")+" + "+esc(p.f)+'</div></div><button class="btn sm" data-seq="'+avail.join(",")+'"'+(avail.length?"":" disabled")+">"+IC.play+'Nghe cả 4</button><button class="icon-btn" id="sh-x" aria-label="Bỏ chọn">'+IC.close+"</button></div>";
  const note=spellNote(s);if(note)h+='<p class="note sh-note">'+note+"</p>";
  if(arr.every(x=>x===null))h+='<p class="note sh-note">Âm tiết này chỉ đọc thanh nhẹ (ví dụ trợ từ), không có thanh 1–4.</p>';
  else h+='<div class="tones4">'+arr.map((c,i)=>{const k=s+(i+1);
    if(c===null)return'<button class="tb" disabled><span class="py">'+esc(kPy(k))+"</span><small>không có</small></button>";
    if(!c&&!hasFile(k))return'<button class="tb" disabled><span class="py">'+esc(kPy(k))+"</span><small>chưa có mẫu</small></button>";
    return'<button class="tb" data-key="'+k+'" aria-label="Nghe '+esc(kPy(k))+'">'+kPyHTML(k)+'<span class="han">'+esc(c||"")+"</span></button>";}).join("")+"</div>";
  return h;}
function markSel(){document.querySelectorAll("#ov-chart [data-cell]").forEach(b=>b.setAttribute("aria-pressed",b.getAttribute("data-cell")===chartSel?"true":"false"));}
function selectCell(s,scroll,play){if(!SYL[s])return;chartSel=s;$("#ch-sheet").innerHTML=sheetHTML(s);markSel();
  const x=$("#sh-x");if(x)x.onclick=()=>{chartSel=null;$("#ch-sheet").innerHTML=sheetHTML(null);markSel();};
  if(scroll){const b=document.querySelector('#ov-chart [data-cell="'+s+'"]'),w=$("#ch-wrap");if(b&&w){const br=b.getBoundingClientRect(),wr=w.getBoundingClientRect();w.scrollLeft+=br.left-wr.left-(wr.width-br.width)/2;w.scrollTop+=br.top-wr.top-(wr.height-br.height)/2;}}
  if(play){const ks=[1,2,3,4].map(t=>s+t).filter(k=>kChar(k)||hasFile(k));if(ks.length)playKeys(ks);}}
