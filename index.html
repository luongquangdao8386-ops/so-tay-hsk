let pq=null;
function initialOf(s){const m=s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])/);return m?m[1]:"";}
function spreadPick(pool,n,cat){const g={};shuffle(pool).forEach(x=>{const c=cat(x);(g[c]=g[c]||[]).push(x);});const lists=shuffle(Object.values(g));const out=[];let r=0;
  while(out.length<n&&lists.some(l=>l.length>r)){lists.forEach(l=>{if(out.length<n&&l[r])out.push(l[r]);});r++;}return shuffle(out);}
function startDrill(id){if(!PRON)return;const D=PRON.drill,info=PRON.drills.find(d=>d.id===id);if(!info)return;
  if(!canPlay()){toast("Máy chưa đọc được tiếng Trung. Xem mục Tiến độ → Giọng đọc.");return;}
  let qs;
  if(id==="tone")qs=spreadPick(D.tone,10,k=>kParse(k).t).map(k=>({k,opts:[1,2,3,4].map(t=>kParse(k).s+t),tone:true}));
  else qs=spreadPick(D[id]||[],10,pr=>id==="nasal"?kParse(pr[0]).s.slice(initialOf(kParse(pr[0]).s).length).replace(/g$/,""):initialOf(pr[0])+initialOf(pr[1])).map(pr=>({k:pr[Math.random()<.5?0:1],opts:shuffle(pr.slice())}));
  pq={id,t:info.t,qs,i:0,score:0,ans:null};
  document.querySelectorAll(".ov:not([hidden])").forEach(o=>o.hidden=true);
  renderPQ();const o=$("#ov-pq");o.hidden=false;o.scrollTop=0;document.body.style.overflow="hidden";playKey(qs[0].k);}
function renderPQ(){const o=$("#ov-pq");let h='<div class="ov-in"><div class="ov-bar"><button class="icon-btn" data-close="ov-pq" aria-label="Đóng">'+IC.close+'</button><div class="ttl">'+esc(pq.t)+(pq.i<pq.qs.length?" · Câu "+(pq.i+1)+"/"+pq.qs.length:"")+'</div><span class="sp"></span></div>';
  if(pq.i>=pq.qs.length){const n=pq.qs.length,best=S.pron.best[pq.id];
    h+='<div class="result"><div class="eyebrow">Kết quả</div><div class="big">'+pq.score+"/"+n+"</div><p>"+(pq.score===n?"Tai bạn rất tốt, không sai câu nào.":pq.score>=n*.7?"Khá tốt. Nghe lại các cặp dễ nhầm rồi làm thêm lượt nữa.":"Hãy mở phần bài học, nghe từng cặp vài lần rồi làm lại.")+"</p>"+(best!=null?'<p style="font-size:13px">Tốt nhất: '+best+"/"+n+"</p>":"")+"</div>";
    h+='<div class="pager"><button class="btn" data-close="ov-pq">Xong</button><button class="btn primary" data-drill="'+pq.id+'">Làm lượt mới</button></div></div>';o.innerHTML=h;return;}
  const q=pq.qs[pq.i];
  h+='<div class="qbar"><i style="width:'+(pq.i/pq.qs.length*100).toFixed(1)+'%"></i></div><div class="q-prompt"><div class="kind">'+(q.tone?"Nghe và chọn thanh đúng":"Nghe và chọn âm đúng")+'</div><button class="listen" data-key="'+q.k+'" aria-label="Nghe lại">'+IC.speak+'</button><div class="hint" style="margin-top:8px">Chạm loa để nghe lại</div></div>';
  h+='<div class="opts grid2">'+q.opts.map((k,i)=>{let c="opt py-opt"+(q.tone?" stack":"");if(pq.ans!==null){if(k===q.k)c+=" right";else if(i===pq.ans)c+=" wrong";}const t=kParse(k).t;
    return'<button class="'+c+'" data-popt="'+i+'"'+(pq.ans!==null?" disabled":"")+">"+(q.tone&&S.set.tones&&pq.ans===null?'<span class="t'+t+'">'+esc(kPy(k))+"</span>":esc(kPy(k)))+(q.tone?"<small>Thanh "+t+"</small>":"")+"</button>";}).join("")+"</div>";
  if(pq.ans!==null){const ok=q.opts[pq.ans]===q.k;
    h+='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Chính xác":"Chưa đúng")+'</b><span class="ans">Âm vừa nghe: '+kPyHTML(q.k)+' <span class="han">'+esc(kChar(q.k))+"</span></span></div>";
    const cmp=q.opts.filter(k=>kChar(k)||hasFile(k));if(cmp.length>1)h+='<div class="cmp"><span class="muted">Nghe so sánh:</span>'+cmp.map(k=>sndBtn(k)).join("")+"</div>";
    h+='<div style="margin-top:14px"><button class="btn primary block" id="pq-next">'+(pq.i===pq.qs.length-1?"Xem kết quả":"Câu tiếp")+IC.next+"</button></div>";}
  h+="</div>";o.innerHTML=h;
  if(pq.ans===null)o.querySelectorAll("[data-popt]").forEach(b=>b.onclick=()=>{const i=+b.getAttribute("data-popt");pq.ans=i;const ok=q.opts[i]===q.k;if(ok)pq.score++;markActive();save();renderPQ();const n=$("#pq-next");if(n)n.focus();});
  else $("#pq-next").onclick=()=>{pq.i++;pq.ans=null;if(pq.i>=pq.qs.length){const b=S.pron.best[pq.id];if(b==null||pq.score>b)S.pron.best[pq.id]=pq.score;save();}renderPQ();o.scrollTop=0;if(pq.i<pq.qs.length)playKey(pq.qs[pq.i].k);};}

/* ---------- sự kiện chung ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-say]");if(!t)return;
  if(t.hasAttribute("data-say")){speak(t.getAttribute("data-say"));return;}
  if(t.hasAttribute("data-key")){playKey(t.getAttribute("data-key"));return;}
  if(t.hasAttribute("data-seq")){playKeys(t.getAttribute("data-seq").split(","));return;}
  if(t.hasAttribute("data-cell")){selectCell(t.getAttribute("data-cell"),false,true);return;}
  if(t.hasAttribute("data-chart")){openChart(t.getAttribute("data-chart")||null);return;}
  if(t.hasAttribute("data-drill")){startDrill(t.getAttribute("data-drill"));return;}
  if(t.hasAttribute("data-pron")){const ovs=document.querySelectorAll(".ov:not([hidden])");ovs.forEach(o=>o.hidden=true);document.body.style.overflow="";openPron(t.getAttribute("data-pron")||null);return;}
  if(t.hasAttribute("data-close")){closeOv(t.getAttribute("data-close"));return;}
  if(t.hasAttribute("data-go")){const ovs=document.querySelectorAll(".ov:not([hidden])");ovs.forEach(o=>o.hidden=true);document.body.style.overflow="";go(t.getAttribute("data-go"));return;}
  if(t.hasAttribute("data-lesson")){openLesson(+t.getAttribute("data-lesson"));return;}
  if(t.hasAttribute("data-word")){const wl=t.getAttribute("data-wlist");openWord(t.getAttribute("data-word"),wl?wl.split(","):null);return;}
  if(t.hasAttribute("data-tab")){lessonTab=t.getAttribute("data-tab");renderLesson();return;}
  if(t.hasAttribute("data-cards")){const n=+t.getAttribute("data-cards");const ws=lessonWords(n);const fresh=ws.filter(w=>status(w.id)==="new");startCards((fresh.length?fresh:ws).map(w=>w.id),"Bài "+n);return;}
  if(t.hasAttribute("data-quiz")){const n=+t.getAttribute("data-quiz");startQuiz(lessonWords(n).map(w=>w.id),"Bài "+n);return;}
  if(t.hasAttribute("data-ch")){wd.ch=+t.getAttribute("data-ch");renderWord();return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const o=[...document.querySelectorAll(".ov:not([hidden])")].pop();if(o)closeOv(o.id);}});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());}catch(e){}
try{new MutationObserver(()=>{render();if(!$("#ov-word").hidden)renderWord();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}

render();
if(PRON)loadAudioIndex();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
